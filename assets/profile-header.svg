<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Nithish R — reliable backend and grounded AI systems</title>
  <desc id="desc">A dark teal banner presenting Nithish R as a software development engineer focused on reliable backend systems, grounded AI, event streams, durable state, and observability.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131b"/>
      <stop offset="0.55" stop-color="#0b2027"/>
      <stop offset="1" stop-color="#12343b"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6c453" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f6c453" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b7d7d5" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#42d8c6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#f6c453"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="1060" cy="72" rx="330" ry="230" fill="url(#tealGlow)"/>
  <ellipse cx="630" cy="350" rx="300" ry="165" fill="url(#amberGlow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="68" y="54" width="298" height="30" rx="15" fill="#12343b" stroke="#2dd4bf" stroke-opacity="0.72"/>
    <circle cx="87" cy="69" r="4" fill="#2dd4bf"/>
    <text x="101" y="74" fill="#9ee9df" font-size="13" font-weight="700" letter-spacing="1.7">SOFTWARE DEVELOPMENT ENGINEER</text>

    <text x="68" y="155" fill="#f7faf9" font-size="60" font-weight="760" letter-spacing="1">NITHISH R</text>
    <text x="70" y="203" fill="#d4e4e2" font-size="24" font-weight="520">Reliable systems. Grounded AI.</text>
    <text x="70" y="235" fill="#9fb9b7" font-size="20">Durable workflows. Focused products.</text>

    <g font-size="14" font-weight="650">
      <rect x="68" y="279" width="78" height="34" rx="17" fill="#f6c453"/>
      <text x="107" y="301" text-anchor="middle" fill="#152127">JAVA</text>
      <rect x="156" y="279" width="103" height="34" rx="17" fill="#173b41" stroke="#4b7777"/>
      <text x="207.5" y="301" text-anchor="middle" fill="#d4e4e2">SPRING</text>
      <rect x="269" y="279" width="91" height="34" rx="17" fill="#173b41" stroke="#4b7777"/>
      <text x="314.5" y="301" text-anchor="middle" fill="#d4e4e2">KAFKA</text>
      <rect x="370" y="279" width="77" height="34" rx="17" fill="#173b41" stroke="#4b7777"/>
      <text x="408.5" y="301" text-anchor="middle" fill="#d4e4e2">AWS</text>
      <rect x="457" y="279" width="91" height="34" rx="17" fill="#173b41" stroke="#2dd4bf"/>
      <text x="502.5" y="301" text-anchor="middle" fill="#9ee9df">GENAI</text>
    </g>

    <g>
      <path d="M754 109H866" fill="none" stroke="#42d8c6" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrowTeal)"/>
      <path d="M975 137V207" fill="none" stroke="#42d8c6" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrowTeal)"/>
      <path d="M892 237H779" fill="none" stroke="#f6c453" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrowAmber)"/>
      <path d="M701 207V138" fill="none" stroke="#42d8c6" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrowTeal)"/>

      <g transform="translate(635 78)">
        <rect width="122" height="62" rx="14" fill="#102c32" stroke="#42d8c6" stroke-opacity="0.80"/>
        <circle cx="22" cy="22" r="7" fill="#42d8c6"/>
        <text x="39" y="27" fill="#e7f4f2" font-size="15" font-weight="700">API</text>
        <text x="19" y="48" fill="#87aaa7" font-size="11">clear boundaries</text>
      </g>

      <g transform="translate(870 78)">
        <rect width="210" height="62" rx="14" fill="#102c32" stroke="#42d8c6" stroke-opacity="0.80"/>
        <circle cx="22" cy="22" r="7" fill="#42d8c6"/>
        <text x="39" y="27" fill="#e7f4f2" font-size="15" font-weight="700">EVENT STREAM</text>
        <text x="19" y="48" fill="#87aaa7" font-size="11">at-least-once delivery</text>
      </g>

      <g transform="translate(892 208)">
        <rect width="188" height="62" rx="14" fill="#102c32" stroke="#f6c453" stroke-opacity="0.86"/>
        <circle cx="22" cy="22" r="7" fill="#f6c453"/>
        <text x="39" y="27" fill="#e7f4f2" font-size="15" font-weight="700">DURABLE STATE</text>
        <text x="19" y="48" fill="#87aaa7" font-size="11">consistent recovery</text>
      </g>

      <g transform="translate(635 208)">
        <rect width="148" height="62" rx="14" fill="#102c32" stroke="#42d8c6" stroke-opacity="0.80"/>
        <circle cx="22" cy="22" r="7" fill="#42d8c6"/>
        <text x="39" y="27" fill="#e7f4f2" font-size="15" font-weight="700">SIGNALS</text>
        <text x="19" y="48" fill="#87aaa7" font-size="11">metrics + traces</text>
      </g>

      <circle cx="975" cy="109" r="6" fill="#42d8c6" filter="url(#softGlow)"/>
      <circle cx="701" cy="239" r="6" fill="#f6c453" filter="url(#softGlow)"/>
    </g>
  </g>
</svg>
